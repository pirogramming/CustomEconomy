server {
    listen 80;
    server_name your_ec2_ip_or_domain;

    location / {
        proxy_pass http://django-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 정적 파일 경로 (정석)
    location /static/ {
        alias /app/staticfiles/;
    }
}