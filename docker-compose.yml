services:
  postgres:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=myproject_db
      - POSTGRES_USER=sihyun
      - POSTGRES_PASSWORD=password123
    # DB가 준비되었는지 확인하는 헬스체크 (권장)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sihyun -d myproject_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  django-app:
    image: xihxxn/custom-economy:latest
    user: root
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    volumes:
      - static_volume:/app/staticfiles
      - .:/app

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - static_volume:/app/staticfiles
    depends_on:
      - django-app

  airflow-webserver:
    image: xihxxn/custom-economy:latest
    user: root
    command: airflow standalone
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Airflow가 Postgres를 사용하도록 강제 지정 (중요)
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:password123@postgres/myproject_db
      - AIRFLOW__CORE__DAGS_FOLDER=/app/dags
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - .:/app

volumes:
  postgres_data:
  static_volume: