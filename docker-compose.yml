services:

  postgres:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myproject_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  django-app:
    image: xihxxn/custom-economy:latest
    command: >
      sh -c "
      mkdir -p /app/staticfiles &&
      chmod -R 777 /app/staticfiles &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      "
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DOCKER_ENV: "1"
    volumes:
      - static_volume:/app/staticfiles


  airflow:
      build:
        context: .
        dockerfile: Dockerfile.airflow
      env_file:
        - .env
      environment:
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres/${DB_NAME}
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__CORE__LOAD_EXAMPLES: "False"
        AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
        # PYTHONPATH를 설정해야 DAG에서 Django 프로젝트를 import 할 수 있습니다.
        PYTHONPATH: /opt/airflow/dags:/app
      depends_on:
        postgres:
          condition: service_healthy
      ports:
        - "8080:8080"
      volumes:
        - ./dags:/opt/airflow/dags
        - .:/app  # Django 프로젝트 소스 코드가 있는 곳을 마운트 (중요!)
      command: >
        bash -c "
        airflow db migrate &&
        airflow users create \
          --username admin \
          --firstname sihyun \
          --lastname lee \
          --role Admin \
          --email admin@example.com \
          --password admin &&
        airflow webserver & 
        airflow scheduler"



  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - static_volume:/app/staticfiles
    depends_on:
      - django-app


volumes:
  postgres_data:
  static_volume:
