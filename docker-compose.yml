services:
  postgres:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=myproject_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password123
    # DB가 준비되었는지 확인 (유저명을 postgres로 수정함)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myproject_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  django-app:
    image: xihxxn/custom-economy:latest
    platform: linux/amd64
    user: root
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    volumes:
      - static_volume:/app/staticfiles
      - .:/app

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - static_volume:/app/staticfiles
    depends_on:
      - django-app

  airflow-webserver:
    image: xihxxn/custom-economy:latest
    platform: linux/amd64
    user: root
    # 최신 버전(3.x)에 맞게 초기화 명령어를 보강했습니다.
    command: >
      bash -c "airflow standalone"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:password123@postgres/myproject_db
      - AIRFLOW__CORE__DAGS_FOLDER=/app/dags
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      # 최신 버전에서 보안을 위해 요구하는 필수 값입니다.
      - AIRFLOW__WEBSERVER__SECRET_KEY=sihyun_secret_key_12345
    volumes:
      - .:/app

volumes:
  postgres_data:
  static_volume: