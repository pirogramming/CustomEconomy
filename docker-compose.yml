version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: postgres_db
    environment:
      - POSTGRES_USER=sihyun
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=myproject_db
    ports:
      - "5432:5432"

  airflow-webserver:
    build: .
    container_name: airflow_webserver
    command: airflow standalone
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      # 내부 통신이므로 postgres(컨테이너 이름) 사용
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://sihyun:password123@postgres:5432/myproject_db
      - DJANGO_SETTINGS_MODULE=config.settings
      - AIRFLOW__CORE__DAGS_FOLDER=/app/dags
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - PYTHONPATH=/app
      - DB_HOST=postgres
      - DB_PORT=5432

  airflow-scheduler:
    build: .
    container_name: airflow_scheduler
    command: airflow scheduler
    depends_on:
      - postgres
    volumes:
      - .:/app
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://sihyun:password123@postgres:5432/myproject_db
      - DJANGO_SETTINGS_MODULE=config.settings
      - AIRFLOW__CORE__DAGS_FOLDER=/app/dags
      - PYTHONPATH=/app
      - DB_HOST=postgres
      - DB_PORT=5432

  django-app:
    build: .
    container_name: django_app
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      # .env의 127.0.0.1을 무시하고 컨테이너 이름으로 접속하도록 설정
      - DB_HOST=postgres
      - DB_NAME=myproject_db
      - DB_USER=sihyun
      - DB_PASSWORD=password123
      - DB_PORT=5432
      - PYTHONPATH=/app