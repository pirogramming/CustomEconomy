{# templates/level_test/test.html #}
{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>레벨 테스트</title>
  <link rel="stylesheet" href="{% static 'level_test.css' %}">
  <link
        href="https://fonts.googleapis.com/css2?family=Kadwa:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap"
        rel="stylesheet">
</head>

<body class="leveltest_body">
  {% csrf_token %}
  <main class="leveltest_main">

    <div class="logo_area">
      <img class="logo" src="{% static 'icon/customEconomyLogo.png' %}" alt="로고">
    </div>

    {% comment %} <div class="logo_area2">
      <p>Custom Economy</p>
    </div> {% endcomment %}


    <div class="leveltest_progress_area">
      <img class="leveltest_progress_banner" id="check1" src="{% static 'icon/progress_unchecked.svg' %}" alt="레벨 테스트 배너">
      <div class="progress_line" id="line1-2"></div>
      
      <img class="leveltest_progress_banner" id="check2" src="{% static 'icon/progress_unchecked.svg' %}" alt="레벨 테스트 배너">
      <div class="progress_line" id="line2-3"></div>
      
      <img class="leveltest_progress_banner" id="check3" src="{% static 'icon/progress_unchecked.svg' %}" alt="레벨 테스트 배너">
      <div class="progress_line" id="line3-4"></div>
      
      <img class="leveltest_progress_banner" id="check4" src="{% static 'icon/progress_unchecked.svg' %}" alt="레벨 테스트 배너">
      <div class="progress_line" id="line4-5"></div>
      
      <img class="leveltest_progress_banner" id="check5" src="{% static 'icon/progress_unchecked.svg' %}" alt="레벨 테스트 배너">
      <div class="progress_line" id="line5-6"></div>
      
      <img class="leveltest_progress_banner" id="check6" src="{% static 'icon/progress_unchecked.svg' %}" alt="레벨 테스트 배너">
      <div class="progress_line" id="line6-7"></div>

      <img class="leveltest_progress_banner" id="check7" src="{% static 'icon/progress_unchecked.svg' %}" alt="레벨 테스트 배너">
      
    </div>

    <br><br>

      <section id="card" class="leveltest_card">
        <div id="qtype" class="leveltest_qtype"></div>

        <div class="question_area">
          <h2 id="question" class="leveltest_question"></h2>

          <div id="options" class="leveltest_options"></div>
        </div>

        <div class="leveltest_actions">
          <button id="nextBtn" class="leveltest_btn leveltest_btn--primary" disabled>다음</button>
        </div>

        {% comment %} <div id="feedback" class="leveltest_feedback"></div> {% endcomment %}
      </section>
    </div>
    
  </main>
  <script>
    function getCookie(name) {
      let value = null;
      if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(";");
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, name.length + 1) === (name + "=")) {
            value = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return value;
    }
    window.__CSRF__ = getCookie("csrftoken");
  </script>

  <script src="{% static 'level_test.js' %}"></script>
</body>
</html>
