{% extends 'base.html' %}
{% load static %}

{% block title %}회원가입 | Custom Economy{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        display: flex;
        justify-content: center; /* 가로 중앙 */
        align-items: center;     /* 세로 중앙 */
        min-height: 100vh;       /* 높이를 화면 꽉 차게(80vh -> 100vh) */
        width: 100%;             /* 800px 대신 100%로 변경해서 중앙 정렬 확보 */
    }
    .auth-card {
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 500px;        /* 카드 자체의 최대 넓이를 살짝 키움 (400px -> 500px) */
        text-align: center;
        /* margin-top: 70px; */  /* 수직 중앙 정렬을 위해 마진 제거 */
    }
    .auth-title {
        font-family: 'Kadwa', sans-serif;
        font-size: 28px;
        color: #192237;
        margin-bottom: 20px;
    }
    /* 폼 내부 스타일링 */
    .auth-form p {
        text-align: left;
        margin-bottom: 15px;
    }
    .auth-form input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 8px;
        margin-top: 5px;
        transition: border-color 0.3s;
    }
    
    .auth-form input:focus {
        border-color: #ef9160;
        outline: none; 
    }
    .auth-form .helptext {
        display: none;
    }
    .auth-form ul {
        list-style: none;
        padding: 0;
        margin: 0;
        color: #ef9160; 
        font-size: 13px;
        text-align: left;
        display: none;
    }
    .auth-form .errorlist {
        display: block;
        margin-bottom: 10px;
    }
    .submit-btn {
        width: 100%;
        padding: 12px;
        background-color: #ef9160;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 20px;
    }
    .submit-btn:hover { background-color: #e67e4d; }
    .help-text { margin-top: 20px; font-size: 14px; color: #888; }
    .help-text a { color: #192237; text-decoration: none; font-weight: bold; }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title">회원가입</h2>
        
        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="submit-btn">가입하기</button>
        </form>

        <p class="help-text">
            이미 계정이 있으신가요? <a href="{% url 'login' %}">로그인</a>
        </p>
    </div>
</div>
{% endblock %}
