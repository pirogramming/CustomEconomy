{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'mypage_edit.css' %}">
{% endblock %}

{% block content %}
<div class="mypage-edit-wrapper">
    <div class="edit-container">
        <div class="page-header">
            <h1 class="page-title">Custom Economy</h1>
        </div>

        <div class="section-title">
            <h2>나의 정보 수정하기</h2>
        </div>

        <div class="profile-card">
            <div class="profile-left">
                <div class="profile-img-box">
                    <img src="{% static 'img/profile-default.png' %}" id="mainProfileImg" alt="프로필 이미지">
                    <button class="edit-icon-btn photo-edit-btn" onclick="openModal('modal-photo')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 20h9"></path>
                            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="profile-right">
                <div class="info-row">
                    <div class="nickname-group">
                        <span class="nickname">주식으로 인생역전</span>
                        <button class="edit-icon-btn" onclick="openModal('modal-nickname')">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 20h9"></path>
                                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="info-row">
                    <div class="interest-group">
                        <span class="interest-label">관심분야 : </span>
                        <span class="interest-value">부동산</span>
                        <button class="edit-icon-btn" onclick="openModal('modal-interest')">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 20h9"></path>
                                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="level-row">
                    <span class="level">Lv.4</span>
                </div>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 40%;"></div>
                    </div>
                    <p class="progress-text">주식으로 인생역전님, 다음 레벨까지 몇 점 남았습니다</p>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-nickname" class="modal-overlay">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModal('modal-nickname')">x</button>
            <h3 class="modal-title">닉네임 수정하기</h3>
            <div class="modal-body">
                <form action="#" method="POST">
                    <label class="input-label">현재 닉네임</label>
                    <input type="text" class="modal-input" value="주식으로 인생역전" readonly>
                    
                    <label class="input-label">바꿀 닉네임</label>
                    <input type="text" class="modal-input" placeholder="새로운 닉네임을 입력하세요">
                    
                    <button type="submit" class="confirm-btn">확인</button>
                </form>
            </div>
        </div>
    </div>

    <div id="modal-photo" class="modal-overlay">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModal('modal-photo')">x</button>
            <h3 class="modal-title">사진 수정하기</h3>
            <div class="modal-body">
                <form action="#" method="POST" enctype="multipart/form-data">
                    <div class="photo-preview-area">
                        <div class="preview-box">
                            <img src="{% static 'img/profile-default.png' %}" id="previewImg" alt="미리보기">
                        </div>
                        <p class="photo-desc">
                            기존 프로필 사진이었다가<br>
                            이미지 업로드 되면 그 사진 뜨게하기<br>
                            근데 엑스 누르면 취소되게
                        </p>
                    </div>

                    <input type="file" id="fileInput" accept="image/*" hidden onchange="previewImage(this)">
                    <label for="fileInput" class="upload-btn">새로운 이미지 파일을 업로드 하세요</label>

                    <div class="btn-group">
                        <button type="button" class="reset-btn">기본프로필로 변경하기</button>
                        <button type="submit" class="confirm-btn small">확인</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="modal-interest" class="modal-overlay">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModal('modal-interest')">x</button>
            <h3 class="modal-title">관심분야 수정하기</h3>
            <div class="modal-body">
                <form action="#" method="POST">
                    <label class="input-label">관심분야 목록</label>
                    <div class="interest-list">
                        <label class="interest-item">
                            <input type="radio" name="interest" value="interest01">
                            <span>관심분야1</span>
                        </label>
                        <label class="interest-item selected">
                            <input type="radio" name="interest" value="realestate" checked>
                            <span>현재선택되어있던거(부동산)</span>
                        </label>
                        <label class="interest-item">
                            <input type="radio" name="interest" value="interest02">
                            <span>관심분야2</span>
                        </label>
                        <label class="interest-item">
                            <input type="radio" name="interest" value="interest03">
                            <span>관심분야3</span>
                        </label>
                    </div>
                    <button type="submit" class="confirm-btn">확인</button>
                </form>
            </div>
        </div>
    </div>

</div>

<script>
    function openModal(modalId) {
        document.getElementById(modalId).style.display = 'flex';
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }

    // 모달 바깥 클릭 시 닫기
    window.onclick = function(event) {
        if (event.target.classList.contains('modal-overlay')) {
            event.target.style.display = "none";
        }
    }

    // 사진 미리보기 기능
    function previewImage(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('previewImg').src = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    // 관심분야 선택 시 스타일 변경 (라디오 버튼 클릭 시)
    const interestItems = document.querySelectorAll('.interest-item');
    interestItems.forEach(item => {
        item.addEventListener('click', function() {
            interestItems.forEach(i => i.classList.remove('selected'));
            this.classList.add('selected');
        });
    });
</script>
{% endblock %}
