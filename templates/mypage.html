{% extends "base.html" %}

{% block content %}
<div class="mypage-container">
    
    <aside class="mypage-sidebar">
        <div class="profile-card">
            <div class="profile-image-area">
                <img src="https://via.placeholder.com/150/14213E/FFC107?text=User" alt="프로필 이미지">
                <button class="edit-icon-btn">✎</button>
            </div>
            <h2 class="user-name">{{ user.username|default:"김금융" }} 님</h2>
            <p class="user-email">{{ user.email|default:"finance_master@email.com" }}</p>
            <div class="user-badge">VIP 회원</div>
        </div>

        <nav class="side-menu">
            <a href="#" class="menu-item active">내 정보 수정</a>
            <a href="#" class="menu-item">비밀번호 변경</a>
            <a href="#" class="menu-item">스크랩한 기사</a>
            <a href="#" class="menu-item">내 퀴즈 성적</a>
            <a href="#" class="menu-item logout">로그아웃</a>
        </nav>
    </aside>

    <main class="mypage-content">
        <section class="content-box">
            <h3 class="section-title">내 정보 수정</h3>
            
            <form class="edit-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>아이디 (Username)</label>
                        <input type="text" value="{{ user.username|default:'finance_king' }}" class="form-input" disabled>
                        <span class="helper-text">* 아이디는 변경할 수 없습니다.</span>
                    </div>
                    <div class="form-group">
                        <label>이메일</label>
                        <input type="email" value="{{ user.email|default:'finance@email.com' }}" class="form-input">
                    </div>
                </div>

                <div class="form-group">
                    <label>닉네임</label>
                    <input type="text" value="김금융" class="form-input">
                </div>

                <div class="form-group">
                    <label>한줄 소개</label>
                    <textarea class="form-input" rows="3">경제적 자유를 꿈꾸는 금융 초보입니다.</textarea>
                </div>
                
                <div class="btn-group-right">
                    <button type="button" class="btn-cancel">취소</button>
                    <button type="submit" class="btn-save">저장하기</button>
                </div>
            </form>
        </section>
    </main>
    
</div>
{% endblock %}
