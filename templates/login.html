{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">환영합니다! 👋</h1>
            <p class="auth-desc">금융 마스터가 되기 위한 여정을 시작하세요.</p>
        </div>

        <form method="POST" action="{% url 'account_login' %}">
            {% csrf_token %}
            
            {% if form.errors %}
                <div class="error-box">
                    아이디 또는 비밀번호를 확인해주세요.
                </div>
            {% endif %}

            <div class="form-group">
                <label class="form-label">아이디 (Username)</label>
                <input type="text" name="login" class="form-input" placeholder="아이디를 입력하세요" required>
            </div>

            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <input type="password" name="password" class="form-input" placeholder="비밀번호를 입력하세요" required>
            </div>

            <button type="submit" class="btn-submit">로그인하기</button>
        </form>

        <div class="auth-footer">
            아직 계정이 없으신가요? 
            <a href="{% url 'account_signup' %}" class="link-highlight">회원가입</a>
        </div>
    </div>
</div>
{% endblock %}
