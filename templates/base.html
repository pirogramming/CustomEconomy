<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}경제 기사 마스터{% endblock %}</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; line-height: 1.6; color: #333; max-width: 1000px; margin: 0 auto; padding: 20px; }
        nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 30px; }
        nav a { text-decoration: none; color: #333; font-weight: bold; margin-left: 15px; }
        .logo { font-size: 24px; font-weight: 900; color: #007bff; }
        footer { margin-top: 50px; text-align: center; font-size: 14px; color: #888; border-top: 1px solid #eee; padding-top: 20px; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav>
        <div class="logo"><a href="/" style="margin-left: 0; color: #007bff;">ECONOMY QUIZ</a></div>
        <div>
            <a href="/">홈</a>
            <a href="/api/articles/">기사목록</a>
            <a href="/api/terms/search/">용어사전</a>
            <a href="/api/accounts/profile/1/">마이페이지</a>
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 경제 기사 마스터 프로젝트. All rights reserved.</p>
    </footer>
</body>
</html>
