name: Deploy to AWS

on:
  push:
    branches: [ "deploy" ] # deploy 브랜치에 푸시될 때만 작동합니다!

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Django
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # 시현님의 도커 허브 아이디로 이미지를 만듭니다.
          tags: ${{ secrets.DOCKER_USERNAME }}/custom-economy:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            # 서버(AWS)에 접속해서 실행할 명령어들입니다.
            cd /home/ubuntu
            sudo docker compose pull
            sudo docker compose up -d
            # DB 마이그레이션까지 자동으로!
            sudo docker compose exec -T django-app python manage.py migrate