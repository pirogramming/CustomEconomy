
{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block title %}Custom Economy{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'base.css' %}">
    <link rel="stylesheet" href="{% static 'main.css' %}">
    {% block extra_css %}{% endblock %}
    <link href="https://fonts.googleapis.com/css2?family=Kadwa:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
	<nav class="sidebar_hs">
        <div class="sidebar_profile_hs"></div>
        <div class="sidebar_btns_hs">
            <div class="main-btn-hs"><a href="{% url 'main' %}" class="{% if request.resolver_match.url_name == 'main' %}active{% endif %}">홈</a></div>
            <div class="articleList-btn-hs"><a href="{% url 'articleList' %}" class="{% if request.resolver_match.url_name == 'articleList' %}active{% endif %}">기사</a></div>
            <div class="terms-btn-hs"><a href="{% url 'terms' %}" class="{% if request.resolver_match.url_name == 'terms' %}active{% endif %}">경제 단어</a></div>
            <div class="league-btn-hs"><a href="{% url 'league' %}" class="{% if request.resolver_match.url_name == 'league' %}active{% endif %}">리그</a></div>
            <div class="mypage-btn-hs"><a href="{% url 'mypage' %}" class="{% if request.resolver_match.url_name == 'mypage' %}active{% endif %}">마이페이지</a></div>
        </div>
        <div class="sidebar_btns_user_hs">
            <a href="{% url 'login' %}" class="login-btn-hs">로그인</a>
            <a href="{% url 'signup' %}" class="signup-btn-hs">회원가입</a>
        </div>
	</nav>

	<main>
		{% block content %}{% endblock %}
	</main>
</body>
</html>
